# ─────────────────────────────────────────────────────────────────────────────
# Pipeline manifest — the single source of truth for which tables flow
# through the platform.
#
# Consumed directly by:
#   - airflow/dags/ingest_source_to_bronze.py   (raw DDL, extract queries)
# Consumed via generated artifacts (run `make generate` after editing):
#   - docker/clickhouse/initdb/01_mirror_schema.sql
#   - scripts/register_debezium_connector.sh
#
# CI fails if the generated artifacts are out of sync with this file.
#
# Column types use PostgreSQL names; the generator maps them to
# ClickHouse types automatically.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# stores
#
# The three pipelines land the same four tables under different names and
# speak different SQL. That fact was written down in four separate places --
# the benchmark harness, the transactional test, the AI assistant's tool
# definitions, and the freshness probe in the ingestion DAG -- each of which
# had its own copy of "mirror tables are called <t>_current" and its own
# opinion on how to truncate a date. Four copies of a naming convention is
# three too many, and the one that drifts is whichever is read least.
#
# Declaring them here makes adding a fourth engine a config change. Anything
# that speaks to an Iceberg table -- DuckDB, StarRocks, Dremio -- is a `table`
# template and a dialect away from being queryable by everything in the repo,
# without touching the harness, the assistant or the DAG.
#
# Connection details deliberately stay out. Their shapes differ (libpq keyword
# arguments against two HTTP protocols) and they carry credentials, which
# belong in the environment. What is declared here is identity, naming and
# dialect, which is the part that was duplicated.
#
# `table` is a template over the manifest's table names; `{table}` is
# substituted. `date_trunc` and `freshness` are the two expressions that
# genuinely differ between the dialects.
# ─────────────────────────────────────────────────────────────────────────────

# `sla.freshness_seconds` is the age past which this store should not be used
# to answer a "what is happening now" question. It is a routing input, not a
# promise: nothing enforces it yet, and #188 measured the mirror at 84s and
# #225 found it 24 hours stale behind a connector task that still reported
# RUNNING. The assistant currently decides which engine to use from the words
# "seconds fresh" in a system prompt, which is exactly the reading that was
# wrong on both occasions. See #231.

stores:
  warehouse:
    # the ingest DAG is @hourly, so one missed run is still within tolerance
    sla:
      freshness_seconds: 7200
    label: Pipe 1 · warehouse (PostgreSQL)
    dialect: postgresql
    table: raw.{table}_source
    date_trunc: date({})
    freshness: SELECT EXTRACT(EPOCH FROM (now() - MAX({col}))) FROM {table}

  lakehouse:
    # @hourly as well, but downstream of Pipe 1, so it inherits that lag
    sla:
      freshness_seconds: 10800
    label: Pipe 2 · lakehouse (Iceberg via Trino)
    dialect: trino
    table: iceberg.lake.{table}
    date_trunc: cast({} as date)
    # to_unixtime rather than date_diff: current_timestamp is a timestamp with
    # time zone and the Iceberg column is not, and Trino refuses to unify those
    # two types inside date_diff. Subtracting epoch seconds sidesteps it.
    freshness: SELECT to_unixtime(current_timestamp) - to_unixtime(max({col})) FROM {table}

  mirror:
    # continuous CDC; measured at 1-5s when healthy, and the ladder treats anything above this as the pipeline falling behind
    sla:
      freshness_seconds: 30
    label: Pipe 3 · mirror (ClickHouse)
    dialect: clickhouse
    # _current, not the base table: the mirror is ReplacingMergeTree, so the
    # base table holds every superseded version until a merge discards them.
    table: mirror.{table}_current
    date_trunc: toDate({})
    freshness: SELECT dateDiff('second', max({col}), now()) FROM {table}

source_schema: public
topic_prefix: cdc

# `owner` and `classification` are the data contract. Every column must appear
# exactly once under classification -- scripts/ci/test_data_contract.py fails
# the build otherwise, which is what stops a new column arriving with nobody
# having said what it is. `email` sat here as `unique_columns` for the whole
# life of the repo with nothing recording that it identifies a person.
#
# public    publishable as-is (catalogue data)
# internal  business data, not personally identifying
# pii       identifies a person
# phi       health information; none in this schema, listed so the vocabulary
#           does not have to change when there is
#
# One owner across all four because they come from one source system. In a
# real deployment these differ per domain, and that is the point of the field.

tables:
  customers:
    owner: data-platform
    classification:
      internal: [customer_id, created_at, updated_at]
      pii: [first_name, last_name, email, address, city, state, zip_code]
    primary_key: customer_id
    cursor_column: updated_at        # incremental extract high-water mark
    partition_column: created_at     # immutable — see note at the bottom
    columns:
      customer_id: BIGINT
      first_name: TEXT
      last_name: TEXT
      email: TEXT
      address: TEXT
      city: TEXT
      state: TEXT
      zip_code: TEXT
      created_at: TIMESTAMP
      updated_at: TIMESTAMP
    update_columns: [first_name, last_name, email, address, city, state, zip_code, updated_at]
    unique_columns: [email]

  products:
    owner: data-platform
    classification:
      public: [name, description, price, category]
      internal: [product_id, stock_quantity, created_at, updated_at]
    primary_key: product_id
    cursor_column: updated_at
    partition_column: created_at     # immutable — see note at the bottom
    columns:
      product_id: BIGINT
      name: TEXT
      description: TEXT
      price: NUMERIC(18,2)
      category: TEXT
      stock_quantity: INTEGER
      created_at: TIMESTAMP
      updated_at: TIMESTAMP
    update_columns: [name, description, price, category, stock_quantity, updated_at]
    low_cardinality: [category]

  orders:
    owner: data-platform
    classification:
      internal: [order_id, customer_id, order_date, total_amount, status, created_at, updated_at]
    primary_key: order_id
    cursor_column: updated_at
    partition_column: created_at     # immutable — see note at the bottom
    columns:
      order_id: BIGINT
      customer_id: BIGINT
      order_date: TIMESTAMP
      total_amount: NUMERIC(18,2)
      status: TEXT
      created_at: TIMESTAMP
      updated_at: TIMESTAMP
    update_columns: [total_amount, status, updated_at]
    low_cardinality: [status]

  order_items:
    owner: data-platform
    classification:
      internal: [item_id, order_id, product_id, quantity, unit_price, created_at, updated_at]
    primary_key: item_id
    cursor_column: updated_at
    partition_column: created_at     # immutable — see note at the bottom
    columns:
      item_id: BIGINT
      order_id: BIGINT
      product_id: BIGINT
      quantity: INTEGER
      unit_price: NUMERIC(18,2)
      created_at: TIMESTAMP
      updated_at: TIMESTAMP
    update_columns: [quantity, unit_price, updated_at]

# ─────────────────────────────────────────────────────────────────────────────
# partition_column
#
# Sets `PARTITION BY toYYYYMM(<col>)` on the ClickHouse mirror table. It must
# name a column the source never UPDATEs — which is why it is created_at and
# not updated_at, and why it must never appear in update_columns above.
#
# The mirror tables are ReplacingMergeTree: every CDC event appends a row, and
# the superseded versions of a key are only discarded when the parts holding
# them are merged. Merges happen within a partition, and ClickHouse will not
# start a merge it lacks the free disk to finish. Unpartitioned, the table is
# one ever-growing part set, so on a tight disk the merge that would reclaim
# space is the first thing skipped -- and the table then grows faster than
# before. One cluster reached 34G against a 20Gi claim this way.
#
# Partition on a mutable column and it fails differently and worse: versions of
# one row land in different partitions, no merge can ever bring them together,
# and <t>_current returns a row per partition the key has visited. load_manifest
# rejects that outright rather than let it ship.
#
# Not set: no TTL. These tables mirror current state, so an age-based TTL would
# delete rows that are still live in the source -- a customer who has not been
# touched in 90 days is still a customer. If a table ever becomes a genuine
# rolling window, add the TTL deliberately for that table, not as a default.
# ─────────────────────────────────────────────────────────────────────────────
