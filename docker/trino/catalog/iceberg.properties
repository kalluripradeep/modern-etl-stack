connector.name=iceberg

# Shared Iceberg catalog: metadata pointers live in postgres-dest
# (schema iceberg_catalog), data files live in MinIO. Spark writes with
# the same catalog via org.apache.iceberg.jdbc.JdbcCatalog.
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://${ENV:DEST_DB_HOST}:${ENV:DEST_DB_PORT}/${ENV:DEST_DB_NAME}?currentSchema=iceberg_catalog
iceberg.jdbc-catalog.connection-user=${ENV:DEST_DB_USER}
iceberg.jdbc-catalog.connection-password=${ENV:DEST_DB_PASSWORD}
iceberg.jdbc-catalog.catalog-name=silver
iceberg.jdbc-catalog.default-warehouse-dir=s3a://silver/

fs.native-s3.enabled=true
s3.endpoint=${ENV:MINIO_ENDPOINT}
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
