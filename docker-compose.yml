# Airflow env shared by webserver, scheduler and dag-processor.
# Connections are provisioned via AIRFLOW_CONN_* so no manual UI setup is
# needed. The JWT secret lives here too, because its whole purpose is to be
# identical across the three services -- copying it into each would invite
# exactly the drift it exists to prevent.
x-airflow-connections: &airflow-connections
  # Airflow 3 tasks authenticate to the Task Execution API with a JWT the
  # scheduler signs and the API server verifies. Unset, each process invents
  # its own secret, every task dies with
  #   airflow.sdk.api.client.ServerResponseError: Invalid auth token
  # and the scheduler only reports "finished with state failed, but the task
  # instance's state attribute is queued" -- which reads like a scheduling
  # race, not an auth failure. Kubernetes is unaffected: the Airflow chart
  # generates and shares one for us.
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-etl-local-jwt-secret-change-in-production}
  AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
  AIRFLOW_CONN_SOURCE_POSTGRES: >-
    postgresql://${SOURCE_DB_USER:-sourceuser}:${SOURCE_DB_PASSWORD:-sourcepass}@postgres-source:5432/${SOURCE_DB_NAME:-sourcedb}
  AIRFLOW_CONN_DEST_POSTGRES: >-
    postgresql://${DEST_DB_USER:-destuser}:${DEST_DB_PASSWORD:-destpass}@postgres-dest:5432/${DEST_DB_NAME:-destdb}
  AIRFLOW_CONN_MINIO_S3: >-
    aws://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@?endpoint_url=http%3A%2F%2Fminio%3A9000

services:
  # PostgreSQL Source Database
  postgres-source:
    image: postgres:15
    container_name: postgres-source
    environment:
      POSTGRES_USER: ${SOURCE_DB_USER:-sourceuser}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD:-sourcepass}
      POSTGRES_DB: ${SOURCE_DB_NAME:-sourcedb}
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    ports:
      - "5432:5432"
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
    networks:
      - etl-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${SOURCE_DB_USER:-sourceuser}"]
      interval: 10s
      retries: 5
      start_period: 5s

  # PostgreSQL Destination
  postgres-dest:
    image: postgres:15
    container_name: postgres-dest
    environment:
      POSTGRES_USER: ${DEST_DB_USER:-destuser}
      POSTGRES_PASSWORD: ${DEST_DB_PASSWORD:-destpass}
      POSTGRES_DB: ${DEST_DB_NAME:-destdb}
      DASHBOARD_DB_USER: ${DASHBOARD_DB_USER:-dashboard_ro}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:-dashboard_ro}
    ports:
      - "5433:5432"
    volumes:
      - postgres-dest-data:/var/lib/postgresql/data
      - ./docker/postgres-dest-init:/docker-entrypoint-initdb.d:ro
    networks:
      - etl-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DEST_DB_USER:-destuser}"]
      interval: 10s
      retries: 5
      start_period: 5s

  # Kafka (KRaft mode)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - etl-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      retries: 5
      start_period: 15s

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8001:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:-admin}
    networks:
      - etl-network

  # MinIO
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - etl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      retries: 5
      start_period: 10s

  # Kafka Connect (Debezium)
  kafka-connect:
    # Stock Debezium image, same as K8s — the old custom build only added the
    # retired JDBC sink connector
    image: quay.io/debezium/connect:2.5
    container_name: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    networks:
      - etl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      retries: 10
      start_period: 30s

  # Apache Spark Master
  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
    ports:
      - "8081:8080"  # Spark Master UI
      - "7077:7077"  # Spark Master port
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./spark/data:/opt/spark-data
    networks:
      - etl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      retries: 5
      start_period: 15s

  # Apache Spark Worker
  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: spark-worker
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./spark/data:/opt/spark-data
    networks:
      - etl-network

  # Trino - SQL query engine over the Iceberg lakehouse
  trino:
    image: trinodb/trino:474
    container_name: trino
    depends_on:
      minio:
        condition: service_healthy
      postgres-dest:
        condition: service_healthy
    ports:
      - "8082:8080"   # Trino UI + JDBC/REST
    environment:
      DEST_DB_HOST: postgres-dest
      DEST_DB_PORT: 5432
      DEST_DB_NAME: ${DEST_DB_NAME:-destdb}
      DEST_DB_USER: ${DEST_DB_USER:-destuser}
      DEST_DB_PASSWORD: ${DEST_DB_PASSWORD:-destpass}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog:ro
    networks:
      - etl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 15s
      retries: 10
      start_period: 45s

  # ClickHouse - columnar hot mirror fed from the CDC topics
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: clickhouse
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8123:8123"   # HTTP interface
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-chuser}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-chpass}
      CLICKHOUSE_DB: mirror
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/initdb:/docker-entrypoint-initdb.d:ro
      # Single file, not the directory: mounting the directory would mask the
      # image's docker_related_config.xml and the server would bind loopback only
      - ./docker/clickhouse/config.d/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
    networks:
      - etl-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8123/ping"]
      interval: 15s
      retries: 5
      start_period: 15s

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - etl-network

  # Alertmanager - routes Prometheus alerts
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9095:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - etl-network

  # Kafka Exporter - CDC consumer lag and topic metrics
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"
    networks:
      - etl-network

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - etl-network

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - etl-network

  # Airflow Database
  airflow-db:
    image: postgres:15
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    networks:
      - etl-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  # Airflow Init
  airflow-init:
    image: apache/airflow:3.3.0-python3.11
    container_name: airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _AIRFLOW_DB_MIGRATE: 'true'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'True'
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
    networks:
      - etl-network

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'True'
      SOURCE_DB_USER: ${SOURCE_DB_USER:-sourceuser}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD:-sourcepass}
      SOURCE_DB_NAME: ${SOURCE_DB_NAME:-sourcedb}
      DEST_DB_USER: ${DEST_DB_USER:-destuser}
      DEST_DB_PASSWORD: ${DEST_DB_PASSWORD:-destpass}
      DEST_DB_NAME: ${DEST_DB_NAME:-destdb}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SPARK_HOME: /home/airflow/.local/lib/python3.11/site-packages/pyspark
      <<: *airflow-connections
      AIRFLOW__METRICS__STATSD_ON: 'True'
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: 8125
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
      - ./spark/jobs:/opt/spark-jobs
    command: api-server
    networks:
      - etl-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'True'
      # Airflow 3 runs every task through the Task Execution API rather than
      # letting it reach the metadata database directly. LocalExecutor forks
      # the task inside THIS container, so the default of localhost:8080 points
      # at nothing here -- the API server is the separate airflow-webserver
      # service. Without this, every task dies before it starts with
      #   httpx.ConnectError: [Errno 111] Connection refused
      # and the scheduler reports "finished with state failed, but the task
      # instance's state attribute is queued", which reads like a scheduling
      # race rather than a missing address. Kubernetes is unaffected: the
      # Airflow chart wires this to its own api-server service.
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      SOURCE_DB_USER: ${SOURCE_DB_USER:-sourceuser}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD:-sourcepass}
      SOURCE_DB_NAME: ${SOURCE_DB_NAME:-sourcedb}
      DEST_DB_USER: ${DEST_DB_USER:-destuser}
      DEST_DB_PASSWORD: ${DEST_DB_PASSWORD:-destpass}
      DEST_DB_NAME: ${DEST_DB_NAME:-destdb}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SPARK_HOME: /home/airflow/.local/lib/python3.11/site-packages/pyspark
      <<: *airflow-connections
      AIRFLOW__METRICS__STATSD_ON: 'True'
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: 8125
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
      - ./spark/jobs:/opt/spark-jobs
    command: scheduler
    networks:
      - etl-network

  airflow-dag-processor:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'True'
      SOURCE_DB_USER: ${SOURCE_DB_USER:-sourceuser}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD:-sourcepass}
      SOURCE_DB_NAME: ${SOURCE_DB_NAME:-sourcedb}
      DEST_DB_USER: ${DEST_DB_USER:-destuser}
      DEST_DB_PASSWORD: ${DEST_DB_PASSWORD:-destpass}
      DEST_DB_NAME: ${DEST_DB_NAME:-destdb}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SPARK_HOME: /home/airflow/.local/lib/python3.11/site-packages/pyspark
      <<: *airflow-connections
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
      - ./spark/jobs:/opt/spark-jobs
    command: dag-processor
    networks:
      - etl-network
  # AI Data Dashboard (Next.js) — the same image k8s/ui/deployment.yaml runs
  data-dashboard:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: data-dashboard:latest
    container_name: data-dashboard
    depends_on:
      postgres-dest:
        condition: service_healthy
    environment:
      DEST_DB_HOST: postgres-dest
      DEST_DB_PORT: 5432
      DEST_DB_NAME: ${DEST_DB_NAME:-destdb}
      # Read-only warehouse role — the dashboard never needs write access
      DEST_DB_USER: ${DASHBOARD_DB_USER:-dashboard_ro}
      DEST_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:-dashboard_ro}
      TRINO_URL: http://trino:8080
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-chuser}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-chpass}
      # Set both to require a login. Left unset the dashboard is open, which
      # is fine on a laptop and not on anything shared.
      DASHBOARD_AUTH_USER: ${DASHBOARD_AUTH_USER:-}
      DASHBOARD_AUTH_PASSWORD: ${DASHBOARD_AUTH_PASSWORD:-}
      # Optional: without it the assistant runs in demo mode.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      # 3000 inside the container; 3001 on the host because Grafana owns 3000
      - "3001:3000"
    networks:
      - etl-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/"]
      interval: 30s
      retries: 5
      start_period: 20s

  # StatsD Exporter for Airflow Metrics
  statsd-exporter:
    image: prom/statsd-exporter:latest
    container_name: statsd-exporter
    command:
      - '--statsd.mapping-config=/etc/statsd/statsd_mapping.yml'
    ports:
      - "9102:9102"
      - "8125:8125/udp"
    volumes:
      - ./monitoring/statsd_mapping.yml:/etc/statsd/statsd_mapping.yml:ro
    networks:
      - etl-network

volumes:
  clickhouse-data:
  postgres-source-data:
  postgres-dest-data:
  kafka-data:
  minio-data:
  airflow-db-data:
  prometheus-data:
  grafana-data:

networks:
  etl-network:
    driver: bridge
