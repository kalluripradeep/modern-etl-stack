apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: etl
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
      # SeaweedFS, which replaced MinIO here.
      #
      # MinIO withdrew its images from public registries. quay.io answers 401,
      # and Docker Hub, GHCR, public ECR and bitnami all deny the pull,
      # including on pinned release tags. A cluster already running keeps
      # working from a cached image and fails the moment a pod is rescheduled
      # onto a clean node, which is the worst shape a dependency failure takes:
      # invisible until it is urgent.
      #
      # SeaweedFS is Apache-2.0 and its S3 gateway covers what this stack asks
      # of it. Checked against 4.48: bucket create and list, put, prefix
      # listing, get, delete, multipart upload (what s3a does for anything
      # sizeable) and common-prefix listing (what Iceberg manifest discovery
      # walks), then the full transactional suite end to end.
      - name: seaweedfs
        # Pinned deliberately. `latest` is how a working deployment changes
        # under you with no commit to point at, and the registry that served
        # it yesterday is the one that stopped serving SeaweedFS.
        image: chrislusf/seaweedfs:4.48
        # -ip.bind=0.0.0.0 is not cosmetic either. SeaweedFS otherwise binds
        # to the pod's own IP rather than all interfaces, so anything probing
        # it over localhost gets connection refused while the service is
        # perfectly healthy. Compose's healthcheck runs inside the container
        # and failed exactly that way, which then blocked Trino from starting
        # on a dependency that was actually fine.
        #
        # -volume.max caps how many volumes this node may create, and running
        # out of slots is what makes every write return HTTP 500 InternalError:
        #   AWSStatus500Exception: Writing Object on lake/orders/data/...
        #   botocore ClientError: An error occurred (InternalError) when
        #     calling the PutObject operation (reached max retries: 4)
        # which reads like a server fault rather than a quota.
        #
        # This was once set to 0 to escape the default of 8. That was wrong.
        # Zero does not mean unlimited -- `weed server -h` says the limit is
        # then "auto configured as free disk space divided by volume size",
        # and volume size defaults to 30GB. On a 52GB disk that is 2 slots,
        # which is fewer than the 8 it was meant to fix. Each S3 bucket is a
        # separate collection needing volumes of its own, and SeaweedFS grows
        # them 7 at a time, so 2 slots cannot serve even one bucket: bronze,
        # silver and airflow-logs were all unwritable (#192).
        #
        # It hid for a week because the number depends on the host's free
        # disk, so it never reproduced on a roomy laptop -- and because
        # Airflow's remote logging writes to this same S3, the one mechanism
        # that would have reported it was disabled by the fault itself.
        #
        # An explicit count is therefore the point; do not put 0 back. Volumes
        # are not preallocated (-master.volumePreallocate is off), so unused
        # slots cost nothing. -volume.minFreeSpace keeps the node's root disk
        # off the floor: this PVC is local-path, so filling it takes the whole
        # cluster with it, and the 1% default leaves only ~1GB of a 100GB disk.
        #
        # SeaweedFS reads S3 credentials from a config file rather than the
        # environment, so the file is written at startup from the secret and
        # exists in neither the repository nor the image. /tmp rather than
        # /data: the data volume outlives the pod and credentials should not.
        command:
        - /bin/sh
        - -ec
        - |
          cat > /tmp/s3.json <<JSON
          {
            "identities": [
              {
                "name": "etl",
                "credentials": [
                  {
                    "accessKey": "${SEAWEEDFS_ROOT_USER}",
                    "secretKey": "${SEAWEEDFS_ROOT_PASSWORD}"
                  }
                ],
                "actions": ["Admin", "Read", "Write", "List", "Tagging"]
              }
            ]
          }
          JSON
          exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json -volume.max=100 -volume.minFreeSpace=10GiB -metricsPort=9327 -ip.bind=0.0.0.0
        ports:
        - containerPort: 9000   # S3 API, on SeaweedFS's port so no consumer moves
        - containerPort: 8888   # filer, the browsable UI here
        - containerPort: 9333   # master, which `weed shell` talks to for buckets
        env:
        - name: SEAWEEDFS_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: SEAWEEDFS_ROOT_USER
        - name: SEAWEEDFS_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: SEAWEEDFS_ROOT_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
        volumeMounts:
        - name: seaweedfs-data
          mountPath: /data
        # /healthz on the S3 port answers 200 without credentials. The probes
        # this replaces used /minio/health/{ready,live}, which do not exist
        # here, and a probe pointed at a missing path fails closed: the pod
        # never goes ready and the deploy times out saying nothing useful.
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: seaweedfs-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 100Gi   # increase for 50GB+ datasets in production
