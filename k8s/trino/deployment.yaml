apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: etl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
    spec:
      containers:
      - name: trino
        image: trinodb/trino:474
        ports:
        - containerPort: 8080
        env:
        - name: DEST_DB_HOST
          value: "postgres-dest-0.postgres-dest.etl.svc.cluster.local"
        - name: DEST_DB_PORT
          value: "5432"
        - name: DEST_DB_NAME
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DEST_DB_NAME
        - name: DEST_DB_USER
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DEST_DB_USER
        - name: DEST_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DEST_DB_PASSWORD
        - name: MINIO_ENDPOINT
          value: "http://minio-0.minio.etl.svc.cluster.local:9000"
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: MINIO_ROOT_PASSWORD
        volumeMounts:
        - name: catalog
          mountPath: /etc/trino/catalog
        readinessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"
      volumes:
      - name: catalog
        configMap:
          name: trino-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: etl
spec:
  selector:
    app: trino
  ports:
  - port: 8080
    targetPort: 8080
