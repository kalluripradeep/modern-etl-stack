apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: etl
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:25.3
        ports:
        - containerPort: 8123   # HTTP
        - containerPort: 9000   # native
        env:
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: CLICKHOUSE_USER
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: CLICKHOUSE_PASSWORD
        - name: CLICKHOUSE_DB
          value: "mirror"
        volumeMounts:
        - name: clickhouse-data
          mountPath: /var/lib/clickhouse
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
        # subPath so only this file is added. Mounting the whole directory
        # masks the image's own docker_related_config.xml, which sets
        # listen_host — without it the server binds loopback only and every
        # probe gets connection refused.
        - name: server-config
          mountPath: /etc/clickhouse-server/config.d/kafka.xml
          subPath: kafka.xml
        # Bounds ClickHouse's own internal logging (trace_log, metric_log,
        # ...). Unbounded, these grew to 34G on one node -- most of it two
        # tables, trace_log and metric_log -- and took the node past the
        # kubelet's eviction threshold. See #144.
        - name: server-config
          mountPath: /etc/clickhouse-server/config.d/02_system_log_retention.xml
          subPath: 02_system_log_retention.xml
        readinessProbe:
          httpGet:
            path: /ping
            port: 8123
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "4Gi"
            cpu: "2"
      volumes:
      - name: initdb
        configMap:
          name: clickhouse-init
      - name: server-config
        configMap:
          name: clickhouse-config
  volumeClaimTemplates:
  - metadata:
      name: clickhouse-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: etl
spec:
  selector:
    app: clickhouse
  ports:
  - name: http
    port: 8123
    targetPort: 8123
  - name: native
    port: 9000
    targetPort: 9000
