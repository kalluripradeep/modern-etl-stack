apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-source
  namespace: etl
spec:
  serviceName: postgres-source
  replicas: 1
  selector:
    matchLabels:
      app: postgres-source
  template:
    metadata:
      labels:
        app: postgres-source
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: SOURCE_DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: SOURCE_DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: SOURCE_DB_NAME
        # WAL settings required for Debezium CDC
        args:
        - postgres
        - -c
        - wal_level=logical
        - -c
        - max_replication_slots=10
        - -c
        - max_wal_senders=10
        # Every order in the stack is written here first, so this container's
        # CPU limit is the ceiling on the whole pipeline's ingest rate. At the
        # 500m it used to carry, a pgbench ladder (scripts/bench/ladder.sh)
        # measured a flat 212 transactions/sec from 4 clients upward, with
        # latency rising linearly in concurrency and throughput not moving --
        # one saturated resource. The same container unlimited on a 16 core
        # host reached 2,519. Freshness held at 1-2s in both, so none of that
        # ceiling was the pipeline.
        #
        # Raising the limit without raising the request leaves scheduling
        # untouched: only requests are reserved, so this still fits a cluster
        # that could run the old value.
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2"
        volumeMounts:
        - name: postgres-source-data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "sourceuser"]
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "sourceuser"]
          initialDelaySeconds: 30
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: postgres-source-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard   # change to gp3 on AWS, pd-ssd on GCP
      resources:
        requests:
          storage: 10Gi
