apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-source
  namespace: etl
spec:
  serviceName: postgres-source
  replicas: 1
  selector:
    matchLabels:
      app: postgres-source
  template:
    metadata:
      labels:
        app: postgres-source
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: SOURCE_DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: SOURCE_DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: SOURCE_DB_NAME
        # WAL settings required for Debezium CDC
        args:
        - postgres
        - -c
        - wal_level=logical
        - -c
        - max_replication_slots=10
        - -c
        - max_wal_senders=10
        # Every order in the stack is written here first, so this container's
        # CPU limit is the ceiling on the whole pipeline's ingest rate, and it
        # has now been measured at three values with scripts/bench/ladder.sh:
        #
        #     limit    knee           ceiling    observed peak CPU
        #     500m     4 clients      212 tps    pegged
        #     2        16 clients     594 tps    1955m -- pegged
        #     4        to be measured
        #
        # Each time the limit has been the thing that bound, never the cluster:
        # at the 2 core reading the nodes were at 9 percent CPU and 15 percent
        # memory. The shape is the giveaway rather than the number. Throughput
        # scales while latency stays flat, then latency doubles per arm for no
        # throughput at all -- 28ms at 16 clients, 54 at 32, 109 at 64, for
        # 562, 594 and 586 tps. Past the knee every added client only queues.
        #
        # Freshness held at 1-2s across every arm at every limit, so none of
        # these ceilings has ever been the pipeline.
        #
        # 4 is a step, not a destination. Whether it is also the next ceiling
        # is answered by the peak CPU column: short of 4000m means something
        # other than CPU now binds, most likely WAL or disk, which is the more
        # interesting finding.
        #
        # Raising the limit without raising the request leaves scheduling
        # untouched: only requests are reserved, so this still fits a cluster
        # that could run the old value. A node with fewer than 4 spare cores
        # simply never reaches the limit -- it is a ceiling, not a demand.
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "4"
        volumeMounts:
        - name: postgres-source-data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "sourceuser"]
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "sourceuser"]
          initialDelaySeconds: 30
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: postgres-source-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard   # change to gp3 on AWS, pd-ssd on GCP
      resources:
        requests:
          storage: 10Gi
