apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-source
  namespace: etl
spec:
  serviceName: postgres-source
  replicas: 1
  selector:
    matchLabels:
      app: postgres-source
  template:
    metadata:
      labels:
        app: postgres-source
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: SOURCE_DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: SOURCE_DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: SOURCE_DB_NAME
        # WAL settings required for Debezium CDC
        args:
        - postgres
        - -c
        - wal_level=logical
        - -c
        - max_replication_slots=10
        - -c
        - max_wal_senders=10
        - -c
        - max_connections=200
        # Memory settings, which this container was never given. The
        # destination has set shared_buffers since it was written; the source
        # never did, so it ran the 128MB default whatever the limit below
        # said.
        #
        # Measured before shipping this, because the obvious assumption is
        # wrong. 128 pgbench clients on a scale 20 set, the two settings run
        # sequentially so they did not compete for CPU:
        #
        #     shared_buffers=128MB (default)   1918 tps   645MiB peak
        #     shared_buffers=256MB             1890 tps   795MiB peak
        #
        # So this buys nothing on this workload and should not be sold as a
        # tuning win. The source takes writes, and writes go through WAL
        # rather than shared_buffers; the ladder found CPU binding at every
        # limit up to 4 and this does not change that. It is here so the
        # server is sized to the container it runs in and matches the
        # destination -- not because it made anything faster.
        #
        # work_mem is deliberately NOT copied from the destination. There it
        # is 64MB, which suits a handful of dbt connections doing bulk loads.
        # Here max_connections is 200, and work_mem is allocated per sort per
        # connection, so the same value is a worst case many times this
        # container's limit. pgbench does not sort, so the 4MB default costs
        # the benchmark nothing and keeps the ceiling an honest one.
        #
        # effective_cache_size is a planner hint, not an allocation. Postgres
        # defaults it to 4GB, which tells the planner this container has twice
        # the memory it is allowed, so index scans price in cache that cannot
        # exist. 1536MB is the limit less shared_buffers.
        - -c
        - shared_buffers=256MB
        - -c
        - effective_cache_size=1536MB
        # Every order in the stack is written here first, so this container's
        # CPU limit is the ceiling on the whole pipeline's ingest rate, and it
        # has now been measured at four values with scripts/bench/ladder.sh:
        #
        #     limit    knee           ceiling    observed peak CPU
        #     500m     4 clients      212 tps    pegged
        #     2        16 clients     594 tps    1955m -- pegged
        #     4        32 clients     1205 tps   3880m -- pegged
        #     8        64-128 clients 2897 tps   7271m -- throttled in bursts
        #
        # Up to 4 the limit was the thing that bound every time, never the
        # cluster:
        # at the 2 core reading the nodes were at 9 percent CPU and 15 percent
        # memory. The shape is the giveaway rather than the number. Throughput
        # scales while latency stays flat, then latency doubles per arm for no
        # throughput at all -- 28ms at 16 clients, 54 at 32, 109 at 64, for
        # 562, 594 and 586 tps. Past the knee every added client only queues.
        #
        # Freshness held at 1-2s across every arm at every limit, so none of
        # these ceilings has ever been the pipeline.
        #
        # The 8 core reading is the first that does not peg, which is why
        # this file says 8. 7271m of 8000m is 91 percent, against 97 and 98
        # at the two limits below, and the knee moved out to somewhere
        # between 64 and 128 clients -- at 64 throughput was still scaling
        # with latency flat.
        #
        # That 91 percent turned out to be two things at once, which is what
        # a rolling average does. cgroup cpu.stat across a whole four arm
        # run throttled 924 periods of 4760 -- 19 percent, against a 1.25
        # percent lifetime baseline -- while averaging 4.65 cores. So the
        # container does still hit the limit, in bursts, and kubectl top
        # could not have shown that.
        #
        # But throttling is not what bounds the rate. pg_stat_activity
        # sampled through every arm has the backends queued on
        # LWLock:WALWrite, with exactly one in IO:WALSync and almost never
        # more than three actually on CPU:
        #
        #     16 clients    LWLock|WALWrite  15   IO|WALSync 1   (on cpu) 1
        #     64 clients    LWLock|WALWrite  60   IO|WALSync 1   (on cpu) 1
        #     128 clients   LWLock|WALWrite 127   IO|WALSync 1   (on cpu) 1
        #
        # That shape is commit serialisation, not CPU starvation. One
        # backend holds WALWriteLock through the write and the fsync and
        # every other backend queues behind it. The ceiling at this limit is
        # WAL fsync latency on the local-path volume, so 16 cores is not the
        # next useful step -- the next measurement is on the WAL side.
        #
        # Freshness stayed flat at 5-6s through every arm including 128
        # clients at 2897 tps, five times the 16 client rate. The source has
        # moved its ceiling four times now and the pipeline has not yet been
        # the thing that binds.
        #
        # max_connections is set because the ladder cannot reach that step
        # without it. Postgres defaults to 100, and reserves some of those,
        # so a 128 client arm fails at client 89 with
        #
        #     FATAL: sorry, too many clients already
        #
        # before a single transaction runs -- a configuration limit reported
        # as a failed measurement. 200 costs nothing to carry: measured at
        # 128 live connections the container held 263MiB, against a 2Gi
        # limit and the 266Mi the same pod used at 64.
        #
        # Raising the limit without raising the request leaves scheduling
        # untouched: only requests are reserved, so this still fits a cluster
        # that could run the old value. A node with fewer than 8 spare cores
        # simply never reaches the limit -- it is a ceiling, not a demand.
        #
        # The memory request is the exception, and it does change scheduling.
        # It was 256Mi against a measured 645MiB peak at 128 clients -- so the
        # pod has been running far above what it is promised, which is what
        # decides the order things get evicted in when a node runs short. That
        # was already true before the settings above; they move the peak to
        # 795MiB. 1Gi covers the measurement with room and still asks for half
        # of what the limit allows.
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "8"
        volumeMounts:
        - name: postgres-source-data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "sourceuser"]
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "sourceuser"]
          initialDelaySeconds: 30
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: postgres-source-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard   # change to gp3 on AWS, pd-ssd on GCP
      resources:
        requests:
          storage: 10Gi
