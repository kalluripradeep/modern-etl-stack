# Airflow Helm Chart values for Kubernetes deployment
# Install: helm install airflow apache-airflow/airflow -n etl -f k8s/airflow/helm-values.yaml

executor: KubernetesExecutor

# Match the Airflow actually running: docker/airflow/Dockerfile builds on
# apache/airflow:3.3.0. Left unset, the chart assumes its own default (3.2.2)
# and reports that on install, which reads as though the version pin never
# took effect.
airflowVersion: "3.3.0"

# We resolve every service by DNS (see the *_HOST entries in etl-env), so the
# legacy per-service environment variables are dead weight. Setting this
# explicitly also silences the chart's deprecation warning and keeps behaviour
# identical when Chart 2.0 flips the default.
enableServiceLinks: false

config:
  core:
    auth_manager: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
  api:
    auth_backends: "airflow.providers.fab.auth_manager.api.auth.backend.basic_auth,airflow.providers.fab.auth_manager.api.auth.backend.session"

images:
  airflow:
    repository: YOUR_REGISTRY/airflow-etl
    tag: latest
    pullPolicy: Always

serviceAccount:
  create: true
  name: airflow

dags:
  gitSync:
    enabled: true
    repo: https://github.com/kalluripradeep/modern-etl-stack.git
    branch: main
    subPath: airflow/dags
    period: 60s
    recommendedProbeSetting: true

# Use extraEnv as a multi-line string (using |) to satisfy strict schema validation
# Some chart versions expect a string that they then parse as YAML internally.
extraEnv: |
  - name: SOURCE_DB_HOST
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: SOURCE_DB_HOST
  - name: SOURCE_DB_PORT
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: SOURCE_DB_PORT
  - name: DEST_DB_HOST
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: DEST_DB_HOST
  - name: DEST_DB_PORT
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: DEST_DB_PORT
  - name: MINIO_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: MINIO_ENDPOINT
  - name: KAFKA_BOOTSTRAP
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: KAFKA_BOOTSTRAP
  - name: SPARK_MASTER_URL
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: SPARK_MASTER_URL
  - name: KAFKA_CONNECT_URL
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: KAFKA_CONNECT_URL
  - name: BRONZE_BUCKET
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: BRONZE_BUCKET
  - name: SILVER_BUCKET
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: SILVER_BUCKET
  - name: ETL_CHUNK_SIZE
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: ETL_CHUNK_SIZE
  - name: INGEST_SCHEDULE
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: INGEST_SCHEDULE
  - name: SILVER_SCHEDULE
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: SILVER_SCHEDULE
  - name: SPARK_EXECUTOR_MEMORY
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: SPARK_EXECUTOR_MEMORY
  - name: SPARK_EXECUTOR_CORES
    valueFrom:
      configMapKeyRef:
        name: etl-env
        key: SPARK_EXECUTOR_CORES
  - name: AIRFLOW_CONN_SPARK_DEFAULT
    value: "spark://spark-master.etl.svc.cluster.local:7077"

extraEnvFrom: |
  - secretRef:
      name: etl-secrets

extraVolumeMounts:
  - name: dbt-project
    mountPath: /opt/airflow/dbt

extraVolumes:
  - name: dbt-project
    configMap:
      name: dbt-project

postgresql:
  enabled: true
  primary:
    persistence:
      enabled: true

# Disable log persistence for local deployments since local-path provisioners
# typically do not support the ReadWriteMany (RWX) access mode required by Airflow.
logs:
  persistence:
    enabled: false

redis:
  enabled: false

# The custom image is large (Spark, JDK, dbt, Cosmos, the AWS providers), so
# importing it takes roughly two minutes — well past the chart's default
# startup budget of failureThreshold(6) x periodSeconds(10) = 60s. The probe
# then kills the container mid-start, forever: CrashLoopBackOff that looks
# like a crash but is a timeout. dagProcessor has no startup probe, which is
# why it stays healthy while these two restart.
# 30 x 10s gives 5 minutes to boot; the probe only applies during startup.
scheduler:
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"
  startupProbe:
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 20

createUserJob:
  useHelmHooks: true
  applyCustomEnv: true
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    email: admin@example.com
    firstName: Admin
    lastName: User
    password: admin

apiServer:
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"
  # See the note on scheduler above — same 60s default, same consequence.
  startupProbe:
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 20
  service:
    type: NodePort
    ports:
      - name: airflow-ui
        port: 8080
        targetPort: 8080
        nodePort: 30880

webserverSecretKey: "etl-secret-key-change-in-production"

# The chart deploys a statsd-exporter (airflow-statsd) that Prometheus scrapes
# (see the airflow-statsd job in k8s/02-configmaps.yaml). Mappings mirror
# monitoring/statsd_mapping.yml so metric names match the alert rules and the
# Data Platform Health dashboard on both compose and Kubernetes.
statsd:
  enabled: true
  overrideMappings:
    - match: "airflow.dagrun.duration.success.*"
      name: "airflow_dagrun_duration_success"
      labels:
        dag_id: "$1"
    - match: "airflow.dagrun.duration.failed.*"
      name: "airflow_dagrun_duration_failed"
      labels:
        dag_id: "$1"
    - match: "airflow.dag.*.*.duration"
      name: "airflow_task_duration"
      labels:
        dag_id: "$1"
        task_id: "$2"
    - match: "airflow.ti_failures"
      name: "airflow_ti_failures"
    - match: "airflow.ti_successes"
      name: "airflow_ti_successes"
    - match: "airflow.scheduler_heartbeat"
      name: "airflow_scheduler_heartbeat"
    - match: "airflow.dag_processing.import_errors"
      name: "airflow_dag_import_errors"
    - match: "airflow.etl.freshness.*"
      name: "etl_source_freshness_lag_seconds"
      labels:
        table: "$1"
    - match: "airflow.etl.revenue_anomaly_z"
      name: "etl_revenue_anomaly_z"
    - match: "airflow.etl.rows_synced.*"
      name: "etl_rows_synced"
      labels:
        table: "$1"
