# Kafka for Strimzi 1.x (KRaft only — ZooKeeper was removed upstream).
#
# Node count and storage live on the KafkaNodePool; the Kafka resource carries
# cluster-wide settings. A single dual-role node (controller + broker) matches
# the single-broker topology this POC uses everywhere else.
#
# deploy.sh rewrites the `class:` line below with the StorageClass you choose.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: etl
  labels:
    strimzi.io/cluster: etl-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 10Gi
    deleteClaim: false
    class: standard
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: etl-kafka
  namespace: etl
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    # Single-broker POC: every replication factor has to be 1.
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # Debezium creates one topic per captured table on first change event.
      # Strimzi defaults this to false, unlike docker-compose which sets
      # KAFKA_AUTO_CREATE_TOPICS_ENABLE=true — so on Kubernetes the producer
      # looped on UNKNOWN_TOPIC_OR_PARTITION while the connector still
      # reported RUNNING, and the mirror silently stayed empty.
      auto.create.topics.enable: "true"
      # Kafka keeps messages for log.retention.hours after they are consumed,
      # and the default is 168 -- a week. Nothing here ever set it, so every
      # benchmark run's CDC traffic stayed on disk for seven days.
      #
      # That took a node down in #225. kafka-log0 held 17G of a 43G
      # local-path directory, the kubelet put kangra into DiskPressure, and
      # dozens of pods were evicted on arrival. A ladder run writes two
      # messages per transaction to cdc.public.orders -- the INSERT and the
      # UPDATE -- so a single afternoon at ~11,000 msg/s is millions of
      # envelopes at roughly 680 bytes each.
      #
      # Bounded by size as well as time, because time alone does not help
      # when one afternoon writes more than the disk holds. retention.bytes
      # is per partition and never touches the active segment, so the real
      # ceiling per partition is roughly retention + segment.
      #
      # 4 GiB rather than something tighter because retention deletes
      # unconsumed messages too. ClickHouse peaked 3.17M messages behind
      # during the #188 ladder -- about 2.1 GiB -- and anything below that
      # would have dropped rows the mirror had not read yet, silently. Lower
      # this only once Pipe 3 keeps up.
      log.retention.hours: 24
      log.retention.bytes: 4294967296
      log.segment.bytes: 268435456
  entityOperator:
    topicOperator: {}
    userOperator: {}
