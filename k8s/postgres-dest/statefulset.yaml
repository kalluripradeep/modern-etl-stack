apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-dest
  namespace: etl
spec:
  serviceName: postgres-dest
  replicas: 1
  selector:
    matchLabels:
      app: postgres-dest
  template:
    metadata:
      labels:
        app: postgres-dest
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DEST_DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DEST_DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DEST_DB_NAME
        - name: DASHBOARD_DB_USER
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DASHBOARD_DB_USER
        - name: DASHBOARD_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DASHBOARD_DB_PASSWORD
        # Tuned for bulk loads (COPY) and dbt transformations
        args:
        - postgres
        - -c
        - shared_buffers=256MB
        - -c
        - work_mem=64MB
        - -c
        - maintenance_work_mem=256MB
        - -c
        - checkpoint_completion_target=0.9
        - -c
        - max_wal_size=1GB
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"
        volumeMounts:
        - name: postgres-dest-data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        - name: dshm
          mountPath: /dev/shm
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "destuser"]
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "destuser"]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: init-scripts
        configMap:
          name: postgres-dest-init
          defaultMode: 0755
      # Parallel query workers exchange rows through POSIX shared memory, which
      # postgres allocates under /dev/shm. Containers get 64MB there by default
      # and nothing in the pod spec changes it, so the ceiling is the runtime's
      # rather than ours -- and work_mem=64MB above sizes each worker's hash
      # table against a budget the workers cannot actually reach.
      #
      # The three-table join in scripts/benchmark.py is the query that asks for
      # the most of it, and it is the one that failed (#258):
      #
      #     could not resize shared memory segment "/PostgreSQL.627441648"
      #     to 16777216 bytes
      #
      # Reported as a failed benchmark cell, but the limit was ours, the same
      # way max_connections was in #188.
      #
      # A Memory emptyDir is tmpfs and counts against the container's memory
      # limit, so this is not free: 256Mi out of the 2Gi limit, which leaves
      # the workers room without letting a runaway query reach the limit
      # before postgres itself does.
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
  volumeClaimTemplates:
  - metadata:
      name: postgres-dest-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard   # change to gp3 on AWS, pd-ssd on GCP
      resources:
        requests:
          storage: 50Gi            # increase to 500Gi+ for 500M rows in production
