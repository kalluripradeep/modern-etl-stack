apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: etl
spec:
  replicas: 2   # increase replicas for more parallelism on large datasets
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
      - name: spark-worker
        # Same Spark version as the driver and the master -- see the note in
        # master-deployment.yaml. A mismatch here is what executors die on.
        image: bitnamilegacy/spark:3.5.0
        env:
        - name: SPARK_MODE
          value: worker
        - name: SPARK_WORKER_MEMORY
          value: "2G"       # increase to 8G for 50GB datasets
        - name: SPARK_WORKER_CORES
          value: "2"        # increase to 4 for large datasets
        - name: SPARK_RPC_AUTHENTICATION_ENABLED
          value: "no"
        - name: SPARK_RPC_ENCRYPTION_ENABLED
          value: "no"
        # Delete finished applications' work directories.
        #
        # A standalone worker keeps a directory per application it has ever
        # run -- executor stdout/stderr plus any JARs the driver shipped --
        # and never removes them on its own. On an hourly pipeline that grows
        # without limit on node disk, which is how this cluster ended up in
        # DiskPressure twice. Cleanup is off by default in Spark, so it has to
        # be asked for.
        #
        # Runs every 30 minutes. The retention was 24 hours, which sounded
        # conservative and was not: spark-submit ships its --jars into every
        # application's work directory on every worker, and those jars are
        # ~30MB (iceberg-spark-runtime 29MB, postgresql 1MB). The silver DAG
        # submits five applications an hour, so a day of retention holds
        # roughly 120 copies -- about 3.6GB of jars alone, against the 4Gi
        # ephemeral-storage limit below. Both workers were evicted with
        #   Pod ephemeral local storage usage exceeds the total limit of
        #   containers 4Gi
        # after 16 days of uptime, and the pods sat in ContainerStatusUnknown
        # (#169).
        #
        # Six hours holds around 30 applications, near 900MB, and still leaves
        # this morning's failure to look at. Raising the limit instead would
        # have been the wrong direction on a single-node cluster whose disk is
        # the node's own.
        #
        # The deeper fix is to stop shipping the jars per application by baking
        # them into the Spark image the way hadoop-aws already is, which would
        # make retention almost free. That changes both the image and the
        # submit command, so it is not folded into an eviction fix.
        - name: SPARK_WORKER_OPTS
          value: >-
            -Dspark.worker.cleanup.enabled=true
            -Dspark.worker.cleanup.interval=1800
            -Dspark.worker.cleanup.appDataTtl=21600
        # S3A / MinIO config for workers
        - name: SPARK_EXTRA_CLASSPATH
          value: "/opt/bitnami/spark/jars/hadoop-aws-*.jar:/opt/bitnami/spark/jars/aws-java-sdk-bundle-*.jar"
        envFrom:
        - configMapRef:
            name: etl-env
        - secretRef:
            name: etl-secrets
        ports:
        - containerPort: 8081
        resources:
          requests:
            memory: "2Gi"   # increase to 8Gi for 50GB datasets
            cpu: "500m"
            # Without a request, the kubelet measures this pod's disk usage
            # against zero, so it always looks over budget and eviction picks
            # victims at random -- that is how the Airflow api-server and
            # scheduler were killed for storage other pods were using.
            # Declaring it makes evictions land on whoever actually overran.
            ephemeral-storage: "2Gi"
          limits:
            memory: "4Gi"   # increase to 16Gi for 50GB datasets
            cpu: "2"
            ephemeral-storage: "4Gi"
