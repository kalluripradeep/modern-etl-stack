apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: etl
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.etl.svc.cluster.local:9093']

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter.etl.svc.cluster.local:9100']

      - job_name: 'kafka-exporter'
        static_configs:
          - targets: ['kafka-exporter.etl.svc.cluster.local:9308']

      # Airflow metrics flow through the Helm chart's statsd-exporter
      # (mappings defined in k8s/airflow/helm-values.yaml)
      - job_name: 'airflow-statsd'
        static_configs:
          - targets: ['airflow-statsd.etl.svc.cluster.local:9102']

      - job_name: 'postgres-source'
        static_configs:
          - targets: ['postgres-exporter-source.etl.svc.cluster.local:9187']
            labels:
              db_instance: source

      - job_name: 'postgres-dest'
        static_configs:
          - targets: ['postgres-exporter-dest.etl.svc.cluster.local:9187']
            labels:
              db_instance: destination

      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
        - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https

      - job_name: 'kubernetes-nodes'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
        - role: node
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

      - job_name: 'kubernetes-cadvisor'
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
        - role: node
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

      - job_name: 'minio'
        metrics_path: /minio/v2/metrics/cluster
        scheme: http
        static_configs:
          - targets: ['minio-0.minio.etl.svc.cluster.local:9000']
  alert_rules.yml: |
    groups:
      - name: data-platform
        rules:
          - alert: AirflowDagRunFailed
            expr: increase(airflow_dagrun_duration_failed_count[30m]) > 0
            labels:
              severity: critical
            annotations:
              summary: "Airflow DAG {{ $labels.dag_id }} failed"
          - alert: CdcConsumerLagHigh
            expr: sum by (consumergroup) (kafka_consumergroup_lag) > 10000
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "CDC consumer group {{ $labels.consumergroup }} is lagging"
          - alert: SourceDataStale
            expr: etl_source_freshness_lag_seconds > 172800
            labels:
              severity: warning
            annotations:
              summary: "Source table {{ $labels.table }} is stale"
          - alert: RevenueAnomaly
            expr: abs(etl_revenue_anomaly_z) > 3
            labels:
              severity: warning
            annotations:
              summary: "Daily revenue is anomalous (z={{ $value }})"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etl-env
  namespace: etl
data:
  SOURCE_DB_HOST: "postgres-source-0.postgres-source.etl.svc.cluster.local"
  SOURCE_DB_PORT: "5432"
  DEST_DB_HOST: "postgres-dest-0.postgres-dest.etl.svc.cluster.local"
  DEST_DB_PORT: "5432"
  MINIO_ENDPOINT: "http://minio-0.minio.etl.svc.cluster.local:9000"
  KAFKA_BOOTSTRAP: "etl-kafka-kafka-bootstrap.etl.svc.cluster.local:9092"
  SPARK_MASTER_URL: "spark://spark-master-0.spark-master.etl.svc.cluster.local:7077"
  KAFKA_CONNECT_URL: "http://kafka-connect-0.kafka-connect.etl.svc.cluster.local:8083"
  BRONZE_BUCKET: "bronze"
  SILVER_BUCKET: "silver"
  # Batch cadence. "@daily" is the production default; set a cron such as
  # "*/15 * * * *" to watch records flow through the batch and lakehouse
  # pipelines without waiting for the next daily run.
  INGEST_SCHEDULE: "@daily"
  SILVER_SCHEDULE: "@daily"
  # Scale these up for large datasets (50GB+)
  ETL_CHUNK_SIZE: "10000"
  SPARK_EXECUTOR_MEMORY: "2g"
  SPARK_EXECUTOR_CORES: "2"
