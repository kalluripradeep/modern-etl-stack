apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: etl
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: [alertname]
      group_wait: 30s
      repeat_interval: 4h
    receivers:
      - name: default
        # Add slack_configs / email_configs here to deliver alerts.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: etl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.27.0
        args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        ports:
        - containerPort: 9093
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: etl
spec:
  selector:
    app: alertmanager
  ports:
  - port: 9093
    targetPort: 9093
