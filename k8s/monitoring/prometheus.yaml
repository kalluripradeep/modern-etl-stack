apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: etl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/metrics
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  - networking.k8s.io
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: etl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: etl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.48.0
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=7d
        # Time-based retention alone does not bound disk: 7d of samples is
        # however many bytes 7d happens to produce. On a busy cluster the TSDB
        # grew until the node hit DiskPressure, the kubelet evicted Prometheus,
        # the replacement started on a fresh emptyDir and began filling it
        # again -- dozens of evicted pods, and the api-server and scheduler
        # taken out alongside it as collateral. A size cap is what actually
        # bounds it; whichever limit is reached first wins.
        - --storage.tsdb.retention.size=2GB
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-data
          mountPath: /prometheus
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
            # Declaring ephemeral-storage is what lets the kubelet hold THIS
            # pod to account. With no request, a pod's usage is compared
            # against zero, so it always looks over budget and eviction picks
            # victims essentially at random -- which is how the Airflow
            # api-server and scheduler died for storage Prometheus was using.
            ephemeral-storage: "3Gi"
          limits:
            memory: "512Mi"
            cpu: "500m"
            ephemeral-storage: "4Gi"
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-data
        # sizeLimit is the backstop: if the TSDB somehow exceeds it despite
        # retention.size, the kubelet evicts this pod alone rather than
        # letting the volume grow until the whole node is under DiskPressure.
        # Keep it above retention.size so normal operation never trips it.
        # Use a PVC in production if the metrics history needs to survive a
        # restart -- an emptyDir starts empty every time the pod moves.
        emptyDir:
          sizeLimit: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: etl
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: etl
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.7.0
        args:
        - --path.procfs=/host/proc
        - --path.sysfs=/host/sys
        # Without --path.rootfs and the mount below, node_filesystem_* describes
        # this container's filesystem, not the node's. The node can then fill to
        # the kubelet's eviction threshold -- tainting itself, evicting pods and
        # refusing to schedule new ones -- while every disk panel stays flat,
        # because nothing is measuring the disk that ran out. One cluster spent
        # four days in that state before anyone thought to run df on the node.
        - --path.rootfs=/host
        # Pseudo and per-container filesystems only add noise: the overlay and
        # kubelet mounts are views onto the same root device already reported.
        - --collector.filesystem.mount-points-exclude=^/host/(dev|proc|sys|run)($|/)
        - --collector.filesystem.fs-types-exclude=^(autofs|;binfmt_misc|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|pstore|securityfs|shm|squashfs|sysfs|tmpfs|tracefs)$
        ports:
        - containerPort: 9100
        volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        - name: root
          mountPath: /host
          readOnly: true
          # So filesystems mounted on the node after this pod starts are still
          # visible to it.
          mountPropagation: HostToContainer
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: sys
        hostPath:
          path: /sys
      - name: root
        hostPath:
          path: /
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: etl
spec:
  selector:
    app: node-exporter
  ports:
  - port: 9100
    targetPort: 9100
