apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: etl
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus.etl.svc.cluster.local:9090
      isDefault: true
    - name: PostgreSQL Warehouse
      type: postgres
      url: postgres-dest.etl.svc.cluster.local:5432
      database: destdb
      user: destuser
      secureJsonData:
        password: destpass
      jsonData:
        sslmode: disable
---
# Dashboard provisioning config: tells Grafana WHERE to load dashboards from
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: etl
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: default
      type: file
      updateIntervalSeconds: 10
      options:
        path: /var/lib/grafana/dashboards
---
# The grafana-dashboards ConfigMap (mounted below) is created by deploy.sh
# from monitoring/grafana/dashboards/*.json — the same Data Platform Health
# dashboard compose provisions — so both environments stay identical.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: etl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.2.0
        ports:
        - containerPort: 3000
        env:
        # Deliberately the AIRFLOW_ADMIN_* keys: Grafana and Airflow share one
        # admin credential here, and there is no GRAFANA_* key in etl-secrets.
        # It is surprising enough that people try admin/admin123 (the default
        # value of AIRFLOW_ADMIN_PASSWORD, which is wrong on any cluster using
        # generate-secrets.sh) or the DASHBOARD_AUTH_* pair, which belongs to
        # the AI dashboard. docker-compose reads GRAFANA_ADMIN_* instead, so the
        # two environments differ; splitting them here would need the new key
        # added to every existing etl-secrets first, or Grafana fails to start.
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: AIRFLOW_ADMIN_USER
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: AIRFLOW_ADMIN_PASSWORD
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        volumeMounts:
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboard-providers
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
        - name: grafana-data
          mountPath: /var/lib/grafana
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      volumes:
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboard-providers
        configMap:
          name: grafana-dashboard-providers
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
      - name: grafana-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: etl
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30300
