apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-dashboard
  namespace: etl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-dashboard
  template:
    metadata:
      labels:
        app: data-dashboard
    spec:
      containers:
      - name: dashboard
        image: data-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: DEST_DB_HOST
          value: "postgres-dest.etl.svc.cluster.local"
        - name: DEST_DB_PORT
          value: "5432"
        - name: DEST_DB_NAME
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DEST_DB_NAME
        # Read-only role — the dashboard never needs write access
        - name: DEST_DB_USER
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DASHBOARD_DB_USER
        - name: DEST_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DASHBOARD_DB_PASSWORD
        - name: DASHBOARD_AUTH_USER
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DASHBOARD_AUTH_USER
        - name: DASHBOARD_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DASHBOARD_AUTH_PASSWORD
        - name: TRINO_URL
          value: "http://trino.etl.svc.cluster.local:8080"
        - name: CLICKHOUSE_URL
          value: "http://clickhouse.etl.svc.cluster.local:8123"
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: CLICKHOUSE_USER
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: CLICKHOUSE_PASSWORD
        # Optional: set ANTHROPIC_API_KEY in etl-secrets to enable the real AI
        # assistant. Without it the dashboard runs in demo mode.
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: data-dashboard
  namespace: etl
spec:
  type: NodePort
  selector:
    app: data-dashboard
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30333   # Dashboard accessible at http://NODE_IP:30333
