apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-dashboard
  namespace: etl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-dashboard
  template:
    metadata:
      labels:
        app: data-dashboard
    spec:
      containers:
      - name: dashboard
        image: data-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: DEST_DB_HOST
          value: "postgres-dest.etl.svc.cluster.local"
        - name: DEST_DB_PORT
          value: "5432"
        - name: DEST_DB_NAME
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DEST_DB_NAME
        - name: DEST_DB_USER
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DEST_DB_USER
        - name: DEST_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: DEST_DB_PASSWORD
        # Optional: set ANTHROPIC_API_KEY in etl-secrets to enable the real AI
        # assistant. Without it the dashboard runs in demo mode.
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: data-dashboard
  namespace: etl
spec:
  type: NodePort
  selector:
    app: data-dashboard
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30333   # Dashboard accessible at http://NODE_IP:30333
