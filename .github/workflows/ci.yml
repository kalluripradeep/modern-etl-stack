name: Enterprise CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Code quality ─────────────────────────────────────────────────────────

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        # Pinned so a new ruff release can't retroactively fail unrelated PRs
        run: pip install ruff==0.14.14
      - name: Run Ruff
        run: ruff check airflow/ scripts/ spark/ sample-data/

  pipeline-config-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify generated artifacts match the pipeline manifest
        run: |
          pip install pyyaml
          python scripts/generate_pipeline_assets.py --check
      - name: Verify dashboard and alert metrics exist in the statsd mapping
        run: python scripts/check_dashboard_metrics.py
      - name: Verify the e2e suite cannot report a pass it did not earn
        # See #149: the suite reported a healthy pipeline while never
        # reading the lakehouse. Runs offline, no cluster needed.
        run: |
          pip install requests psycopg2-binary faker
          python scripts/ci/test_e2e_accounting.py
      - name: Verify the Bronze load contract
        # A Spark job that succeeds at doing nothing is how Pipe 2 stayed
        # broken while its DAG was green (#149). Fakes stand in for a Spark
        # session, so no cluster is needed -- but pyspark itself is, because
        # the check that matters asserts recursiveFileLookup is set on the
        # real reader, and dropping that assertion to avoid the install would
        # leave the silent-failure mode unguarded.
        run: |
          pip install pyspark==3.5.0
          python scripts/ci/test_bronze_guard.py
      - name: Verify the COPY path works on both psycopg drivers
        # apache-airflow-providers-postgres is floored, not capped, and its
        # 6.x line moved to psycopg3 where copy_expert does not exist. Fakes
        # stand in for both drivers, so neither has to be installed.
        run: python scripts/ci/test_copy_compat.py
      - name: Verify a failed seed cannot report success
        # deploy.sh decides from this exit code whether to print "Sample data
        # seeded". The generator used to print an error and return 0, so a
        # seed that never reached the database looked like a successful one.
        run: |
          pip install psycopg2-binary faker
          python scripts/ci/test_seed_exit_code.py
      - name: Verify a partial seed cannot overstate what it wrote
        # One failed row used to abort the transaction and empty the whole
        # seed while still printing "Generated 100 customers".
        run: python scripts/ci/test_seed_partial_failure.py
      - name: Verify the seeded schema satisfies the pipeline manifest
        # Ingestion selects the manifest's columns by name. A seeder that
        # creates product_name where the manifest says name breaks every run
        # and the error blames the source data (#144).
        run: python scripts/ci/test_seed_matches_manifest.py

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mypy
        run: pip install mypy types-requests
      - name: Run Mypy
        # Run from inside the dags folder so the repo's airflow/ directory
        # doesn't shadow the (uninstalled) apache-airflow package
        run: cd airflow/dags && mypy . --ignore-missing-imports

  lint-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SQLFluff
        run: pip install sqlfluff
      - name: Lint dbt SQL models
        run: sqlfluff lint dbt/models

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yamllint
        run: |
          pip install yamllint
          yamllint k8s/ monitoring/ docker-compose.yml .github/
      - name: XML well-formedness
        # A malformed file under docker/clickhouse/config.d/ is not a lint
        # nit: ClickHouse parses config.d at startup and refuses to boot, so
        # the failure surfaces as an unschedulable pod on deploy rather than
        # here. Comments in these files carry incident write-ups, and XML
        # comments cannot contain a double hyphen, which is exactly how one
        # gets broken while being edited.
        run: |
          python -c "
          import glob, sys, xml.etree.ElementTree as ET
          bad = 0
          for f in sorted(glob.glob('docker/**/*.xml', recursive=True)):
              try:
                  ET.parse(f)
                  print('ok   ' + f)
              except ET.ParseError as e:
                  print('FAIL ' + f + ': ' + str(e)); bad = 1
          sys.exit(bad)
          "

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: "**/*.md"
        continue-on-error: true

  # ── Security ─────────────────────────────────────────────────────────────

  security-bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit (medium severity and above)
        run: bandit -r airflow scripts spark sample-data -ll

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks (scan checkout)
        # Scans the checked-out tree, not git history — history still contains
        # the removed vendored dbt-mcp sources which we don't control.
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks dir . --no-banner

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit (high and above, runtime deps)
        working-directory: ui
        # --omit=dev: audit only what ships in the dashboard. Build-time lint
        # tooling (eslint-config-next -> typescript-eslint -> minimatch ->
        # brace-expansion) carries a DoS with no compatible patched version
        # yet; it never reaches production and clears when eslint-config-next
        # ships an updated tree. Runtime deps stay gated at high.
        run: npm audit --omit=dev --audit-level=high

  # ── Containers & infrastructure ──────────────────────────────────────────

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          failure-threshold: error

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Airflow Docker Image
        # Context must be the repo root — the Dockerfile copies
        # docker/airflow/requirements-airflow.txt and spark/jobs/
        run: docker build -t test-airflow -f docker/airflow/Dockerfile .

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config -q

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes manifests
        # -ignore-missing-schemas: Strimzi Kafka CRDs have no upstream schema
        # helm-values.yaml is a Helm values file, not a manifest
        run: kubeconform -ignore-missing-schemas -ignore-filename-pattern 'helm-values.yaml' -summary -skip Kafka,KafkaNodePool k8s/

  # ── Application builds & integration ─────────────────────────────────────

  ui-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npx eslint .
      - name: Build
        run: npm run build

  dbt-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: destuser
          POSTGRES_PASSWORD: destpass
          POSTGRES_DB: destdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dbt
        run: pip install dbt-core dbt-postgres
      - name: Seed raw source tables
        env:
          PGPASSWORD: destpass
        run: psql -h localhost -U destuser -d destdb -v ON_ERROR_STOP=1 -f scripts/ci/seed_dbt_ci.sql
      - name: Run dbt
        env:
          DEST_DB_HOST: localhost
          DEST_DB_USER: destuser
          DEST_DB_PASSWORD: destpass
          DEST_DB_NAME: destdb
          DEST_DB_PORT: '5432'
        run: |
          cd dbt
          dbt debug
          dbt deps
          dbt run
          dbt test
