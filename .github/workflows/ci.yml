name: Enterprise CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Code quality ─────────────────────────────────────────────────────────

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check airflow/ scripts/ spark/ sample-data/

  pipeline-config-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify generated artifacts match the pipeline manifest
        run: |
          pip install pyyaml
          python scripts/generate_pipeline_assets.py --check

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mypy
        run: pip install mypy types-requests
      - name: Run Mypy
        # Run from inside the dags folder so the repo's airflow/ directory
        # doesn't shadow the (uninstalled) apache-airflow package
        run: cd airflow/dags && mypy . --ignore-missing-imports

  lint-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SQLFluff
        run: pip install sqlfluff
      - name: Lint dbt SQL models
        run: sqlfluff lint dbt/models

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yamllint
        run: |
          pip install yamllint
          yamllint k8s/ monitoring/ docker-compose.yml .github/

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: "**/*.md"
        continue-on-error: true

  # ── Security ─────────────────────────────────────────────────────────────

  security-bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit (medium severity and above)
        run: bandit -r airflow scripts spark sample-data -ll

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks (scan checkout)
        # Scans the checked-out tree, not git history — history still contains
        # the removed vendored dbt-mcp sources which we don't control.
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks dir . --no-banner

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit (high and above)
        working-directory: ui
        run: npm audit --audit-level=high

  # ── Containers & infrastructure ──────────────────────────────────────────

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          failure-threshold: error

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Airflow Docker Image
        # Context must be the repo root — the Dockerfile copies
        # docker/airflow/requirements-airflow.txt and spark/jobs/
        run: docker build -t test-airflow -f docker/airflow/Dockerfile .

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config -q

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes manifests
        # -ignore-missing-schemas: Strimzi Kafka CRDs have no upstream schema
        # helm-values.yaml is a Helm values file, not a manifest
        run: kubeconform -ignore-missing-schemas -ignore-filename-pattern 'helm-values.yaml' -summary -skip Kafka k8s/

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0
      - name: Helm Lint
        run: helm lint helm/etl-stack/

  # ── Application builds & integration ─────────────────────────────────────

  ui-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npx eslint .
      - name: Build
        run: npm run build

  dbt-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: destuser
          POSTGRES_PASSWORD: destpass
          POSTGRES_DB: destdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dbt
        run: pip install dbt-core dbt-postgres
      - name: Seed raw source tables
        env:
          PGPASSWORD: destpass
        run: psql -h localhost -U destuser -d destdb -v ON_ERROR_STOP=1 -f scripts/ci/seed_dbt_ci.sql
      - name: Run dbt
        env:
          DEST_DB_HOST: localhost
          DEST_DB_USER: destuser
          DEST_DB_PASSWORD: destpass
          DEST_DB_NAME: destdb
          DEST_DB_PORT: '5432'
        run: |
          cd dbt
          dbt debug
          dbt deps
          dbt run
          dbt test
