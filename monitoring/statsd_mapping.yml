# statsd-exporter mapping: turns Airflow's dotted statsd names into
# clean Prometheus metrics with labels.
mappings:
  - match: "airflow.dagrun.duration.success.*"
    name: "airflow_dagrun_duration_success"
    labels:
      dag_id: "$1"
  - match: "airflow.dagrun.duration.failed.*"
    name: "airflow_dagrun_duration_failed"
    labels:
      dag_id: "$1"
  - match: "airflow.dag.*.*.duration"
    name: "airflow_task_duration"
    labels:
      dag_id: "$1"
      task_id: "$2"
  - match: "airflow.ti_failures"
    name: "airflow_ti_failures"
  - match: "airflow.ti_successes"
    name: "airflow_ti_successes"
  - match: "airflow.scheduler_heartbeat"
    name: "airflow_scheduler_heartbeat"
  - match: "airflow.dag_processing.import_errors"
    name: "airflow_dag_import_errors"
  # Custom platform metrics emitted by the ingestion DAG
  - match: "airflow.etl.freshness.*"
    name: "etl_source_freshness_lag_seconds"
    labels:
      table: "$1"
  - match: "airflow.etl.revenue_anomaly_z"
    name: "etl_revenue_anomaly_z"
  - match: "airflow.etl.rows_synced.*"
    name: "etl_rows_synced"
    labels:
      table: "$1"
