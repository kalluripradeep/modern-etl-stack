global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'airflow-statsd'
    static_configs:
      - targets: ['statsd-exporter:9102']

  # SeaweedFS exposes Prometheus metrics on its own port rather than a path
  # under the S3 API, so both the target and the path differ from MinIO's.
  # Requires -metricsPort on the server; without it this scrape just fails.
  - job_name: 'seaweedfs'
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['seaweedfs:9327']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
